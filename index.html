  .nav-item { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:10px; font-size:14px; color:#334155; font-weight:500; cursor:pointer; }
  .nav-item:hover { background:#EEF5FC; color:#005BAC; }
  .nav-item.active { background:#005BAC; color:#fff; box-shadow: 0 4px 12px rgba(0,91,172,.30); }
  .nav-item.active svg { color:#fff; }
  /* Bottom nav (mobile) */
  .bnav { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:8px 4px; flex:1; color:#64748B; font-size:11px; font-weight:600; }

  .modal-backdrop { position:fixed; inset:0; background:rgba(15,23,42,.4); backdrop-filter: blur(4px); z-index:50; display:flex; align-items:center; justify-content:center; padding:16px; }

<script>
/* ============================================================
   Management Platform — single-file build
   数据 100% 存本地 (localStorage)，可导出 JSON 至 OneDrive 同步。
   ============================================================ */

/* ---------------- Utility ---------------- */
dayjs.extend(dayjs_plugin_customParseFormat);

const STORAGE_KEY = 'mgmt-platform-v1';
const SHIFT_START = '09:35';
const SHIFT_END   = '17:30';

const uid = (p='') => p + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const $  = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d=2) => n == null || isNaN(n) ? '—' : Number(n).toFixed(d).replace(/\.?0+$/, '');
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

function parseTime(str) {
  if (!str) return null;
  const s = String(str).trim();
  const m = s.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if (!m) return null;
  const h = +m[1], mm = +m[2];
  if (h > 23 || mm > 59) return null;
  return `${String(h).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
}
function toMin(hhmm) { if (!hhmm) return 0; const [h,m] = hhmm.split(':').map(Number); return h*60 + m; }
function computeDaily({ clockIn, clockOut }) {
  const inT = parseTime(clockIn), outT = parseTime(clockOut);
  if (!inT || !outT) return { clockIn: inT, clockOut: outT, workHours: 0, isLate:false, isEarlyLeave:false, status:'absent' };
  const startMin = toMin(SHIFT_START), endMin = toMin(SHIFT_END);
  const inMin = toMin(inT), outMin = toMin(outT);
  const workHours = Math.max(0, (outMin - inMin) / 60);
  const isLate = inMin > startMin;
  const isEarlyLeave = outMin < endMin;
  let status = 'normal';
  if (isLate && isEarlyLeave) status = 'late_and_early';
  else if (isLate) status = 'late';
  else if (isEarlyLeave) status = 'early';
  return { clockIn: inT, clockOut: outT, workHours: Math.round(workHours*100)/100, isLate, isEarlyLeave, status };
}

/* ---------------- Store (localStorage) ---------------- */
const defaultStore = () => ({
  version: 1,
  meta: { updatedAt: new Date().toISOString(), createdAt: new Date().toISOString() },
  employees: [],   // {id, name, department, employeeNo}
  projects:  [],   // {id, name, code, color, budgetHours}
  memberships:[],  // {id, employeeId, projectId, weight, role, startDate, endDate?}
  attendance:[],   // {id, employeeId, date, clockIn, clockOut, workHours, status, isLate, isEarlyLeave, note?}
});

let db = load();

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultStore();
    const parsed = JSON.parse(raw);
    // Merge with defaults (forward-compat)
    return { ...defaultStore(), ...parsed };
  } catch (e) {
    console.warn('load() failed, resetting:', e);
    return defaultStore();
  }
}
function save() {
  db.meta.updatedAt = new Date().toISOString();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
}

/* ---------------- Toast / Modal ---------------- */
let toastTimer = null;
function toast(msg) {
  clearTimeout(toastTimer);
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  toastTimer = setTimeout(()=> el.remove(), 2400);
}
function modal(html, onMount) {
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.innerHTML = `<div class="modal">${html}</div>`;
  const close = () => wrap.remove();
  wrap.addEventListener('click', (e) => { if (e.target === wrap) close(); });
  document.body.appendChild(wrap);
  onMount?.(wrap, close);
  return close;
}
function confirmDialog(msg, onOk) {
  modal(`
    <h3 class="text-lg font-bold mb-2">确认操作</h3>
    <p class="text-ink-500 mb-6">${esc(msg)}</p>
    <div class="flex justify-end gap-2">
      <button class="btn btn-ghost" data-x="cancel">取消</button>
      <button class="btn btn-primary" data-x="ok" style="background:#B91C1C">确认</button>
    </div>
  `, (root, close) => {
    root.querySelector('[data-x=cancel]').onclick = close;
    root.querySelector('[data-x=ok]').onclick = () => { close(); onOk(); };
  });
}

/* ---------------- Router ---------------- */
const routes = ['dashboard', 'employees', 'projects', 'attendance', 'allocation', 'analytics', 'help'];
function currentRoute() {
  const h = (location.hash || '#/dashboard').replace(/^#\/?/, '');
  return routes.includes(h) ? h : 'dashboard';
}
window.addEventListener('hashchange', render);

/* ---------------- Layout Shell ---------------- */
function shell(mainHtml) {
  const r = currentRoute();
  const navItems = [
    { id:'dashboard', label:'工作台', icon:'i-dashboard' },
    { id:'employees', label:'员工',   icon:'i-users' },
    { id:'projects',  label:'项目',   icon:'i-briefcase' },
    { id:'attendance',label:'考勤',   icon:'i-clock' },
    { id:'allocation',label:'分配',   icon:'i-sliders' },
    { id:'analytics', label:'分析',   icon:'i-chart' },
    { id:'help',      label:'帮助',   icon:'i-help' },
  ];
  return `
    <div class="min-h-screen flex">
      <!-- Sidebar (desktop) -->
      <aside class="hidden md:flex flex-col w-60 shrink-0 bg-white border-r border-slate-200 p-4">
        <div class="flex items-center gap-2 px-2 py-3 mb-3">
          <div class="w-9 h-9 rounded-xl bg-brand-500 text-white flex items-center justify-center font-bold shadow-pop">MP</div>
          <div>
            <div class="font-bold text-sm leading-tight">Management</div>
            <div class="text-[11px] text-ink-400 leading-tight">项目 · 考勤 · 工时</div>
          </div>
        </div>
        <nav class="flex flex-col gap-1">
          ${navItems.map(n => `
            <a href="#/${n.id}" class="nav-item ${r===n.id?'active':''}">
              <svg class="w-4 h-4 text-ink-400"><use href="#${n.icon}"/></svg>
              <span>${n.label}</span>
            </a>
          `).join('')}
        </nav>
        <div class="mt-auto text-[11px] text-ink-400 px-2 pt-4 border-t border-slate-100">
          v1.0 · 本地数据，浏览器缓存<br/>
          <span class="text-ink-300">${new Date(db.meta.updatedAt).toLocaleString('zh-CN')}</span>
        </div>
      </aside>

      <!-- Main -->
      <main class="flex-1 min-w-0 pb-20 md:pb-6">
        <!-- Topbar -->
        <header class="sticky top-0 z-10 bg-canvas/85 backdrop-blur border-b border-slate-200/80">
          <div class="max-w-6xl mx-auto px-4 md:px-8 h-14 flex items-center gap-3">
            <button class="md:hidden btn-ghost btn !p-2" onclick="document.body.dispatchEvent(new CustomEvent('open-menu'))" aria-label="菜单">
              <svg class="w-5 h-5"><use href="#i-menu"/></svg>
            </button>
            <div class="font-bold text-base md:text-lg">${navItems.find(n=>n.id===r).label}</div>
            <div class="ml-auto flex items-center gap-2">
              <button class="btn btn-ghost" onclick="exportData()" title="导出到 JSON">
                <svg class="w-4 h-4"><use href="#i-download"/></svg><span class="hidden sm:inline">导出</span>
              </button>
              <label class="btn btn-ghost cursor-pointer" title="从 JSON 导入">
                <svg class="w-4 h-4"><use href="#i-upload"/></svg><span class="hidden sm:inline">导入</span>
                <input type="file" accept=".json,application/json" hidden onchange="importDataFile(this.files[0])"/>
              </label>
            </div>
          </div>
        </header>

        <div class="max-w-6xl mx-auto p-4 md:p-8">
          ${mainHtml}
        </div>
      </main>
    </div>

    <!-- Mobile bottom nav -->
    <nav class="md:hidden fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 flex z-20" style="padding-bottom: env(safe-area-inset-bottom);">
      ${navItems.slice(0,6).map(n => `
        <a href="#/${n.id}" class="bnav ${r===n.id?'active':''}">
          <svg class="w-5 h-5"><use href="#${n.icon}"/></svg>
          <span>${n.label}</span>
        </a>
      `).join('')}
    </nav>
  `;
}

/* ---------------- Views ---------------- */
function viewDashboard() {
  const emps = db.employees.length;
  const projs = db.projects.length;
  const totalHours = db.attendance.reduce((s, a) => s + (a.workHours || 0), 0);
  const lateCnt = db.attendance.filter(a => a.isLate).length;
  const earlyCnt = db.attendance.filter(a => a.isEarlyLeave).length;
  const normalCnt = db.attendance.filter(a => a.status === 'normal').length;
  const attendedDays = db.attendance.filter(a => a.workHours > 0).length;

  // Last 14 days chart data
  const last14 = [...Array(14)].map((_,i) => dayjs().subtract(13-i, 'day').format('YYYY-MM-DD'));
  const dailyHours = last14.map(d => db.attendance.filter(a => a.date === d).reduce((s,a)=>s+(a.workHours||0), 0));

  // Project hours (weighted allocation)
  const projHours = computeProjectHours();
  const topProjects = [...projHours.values()].sort((a,b)=>b.hours-a.hours).slice(0,5);

  const empty = emps === 0 && projs === 0 && db.attendance.length === 0;

  return `
    <!-- KPI grid -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 mb-6">
      ${kpi('员工', emps, 'i-users', 'brand-500')}
      ${kpi('项目', projs, 'i-briefcase', 'emerald-500')}
      ${kpi('总工时', fmt(totalHours,1)+'h', 'i-clock', 'amber-500')}
      ${kpi('异常/正常', `${lateCnt+earlyCnt} / ${normalCnt}`, 'i-chart', 'rose-500')}

/* --- Excel import --- */
async function importExcel(file) {
  if (!file) return;
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: false });
    const range = inferDateRange(file.name, wb.SheetNames[0]);
    if (!range) throw new Error('无法从文件名 / 表名识别日期范围，示例：考勤月报-2026年06月08日至2026年07月07日-*.xlsx');
    const headerIdx = rows.findIndex(r => r && String(r[0]).includes('帐号'));
    if (headerIdx < 0) throw new Error('未找到表头行（第一列应为「帐号」）');
    const colDate = buildColumnDates(rows[headerIdx], range.startDate);
    const dateCols = Object.keys(colDate).map(Number);

    let addedEmp = 0, upsertRec = 0, skipped = 0;
    for (let i = headerIdx + 2; i < rows.length; i += 2) {
      const rIn = rows[i]; const rOut = rows[i+1] || [];
      if (!rIn) continue;
      const name = String(rIn[2] || '').trim();
      if (!name) continue;
      const department = String(rIn[3] || '').trim();
      const employeeNo = String(rIn[1] || '').trim();
      // Find or create employee
      let emp = db.employees.find(e => e.name === name);
      if (!emp) { emp = { id: uid('e_'), name, department, employeeNo }; db.employees.push(emp); addedEmp++; }
      else {
        if (!emp.department && department) emp.department = department;
        if (!emp.employeeNo && employeeNo) emp.employeeNo = employeeNo;
      }
      for (const c of dateCols) {
        const clockIn = String(rIn[c] || '').trim() || null;
        const clockOut = String(rOut[c] || '').trim() || null;
        if (!clockIn && !clockOut) { skipped++; continue; }
        const daily = computeDaily({ clockIn, clockOut });
        // Upsert by (employeeId, date)
        const key = a => a.employeeId === emp.id && a.date === colDate[c];
        const existing = db.attendance.find(key);
        const rec = {
          employeeId: emp.id, date: colDate[c],
          clockIn: daily.clockIn, clockOut: daily.clockOut, workHours: daily.workHours,
          status: daily.status, isLate: daily.isLate, isEarlyLeave: daily.isEarlyLeave,
        };
        if (existing) Object.assign(existing, rec);
        else db.attendance.push({ id: uid('a_'), ...rec });
        upsertRec++;
      }
    }
    save(); render();
    toast(`导入完成：${upsertRec} 条考勤，${addedEmp} 位新员工`);
  } catch (e) {
    console.error(e);
    modal(`
      <h3 class="text-lg font-bold text-red-600 mb-3">导入失败</h3>
      <p class="text-ink-500 text-sm mb-4">${esc(e.message || String(e))}</p>
      <p class="text-xs text-ink-400 mb-4">要求：矩阵式月报，表头首列为「帐号」，含 08/一 09/二 … 日期列；日期范围可从文件名或工作表名识别，如 <code>考勤月报-2026年06月08日至2026年07月07日</code>。</p>
      <div class="flex justify-end"><button class="btn btn-primary" onclick="this.closest('.modal-backdrop').remove()">知道了</button></div>
    `);
  }
}
function inferDateRange(...names) {
  const re = /(\d{4})年(\d{2})月(\d{2})日至(\d{4})年(\d{2})月(\d{2})日/;
  for (const n of names) {
    const m = String(n||'').match(re);
    if (m) return { startDate: `${m[1]}-${m[2]}-${m[3]}`, endDate: `${m[4]}-${m[5]}-${m[6]}` };
  }
  return null;
}
function buildColumnDates(headerRow, startDate) {
  const map = {};
  let cursor = dayjs(startDate);
  // Find the first date-like header column (contains "/")
  let firstCol = -1;
  for (let c = 0; c < headerRow.length; c++) {
    const cell = String(headerRow[c]||'').trim();
    if (/^\d{1,2}\/./.test(cell)) { firstCol = c; break; }
  }
  if (firstCol < 0) firstCol = 10; // fallback to canonical index
  map[firstCol] = cursor.format('YYYY-MM-DD');
  let prevDay = cursor.date();
  for (let c = firstCol + 1; c < headerRow.length; c++) {
    const cell = String(headerRow[c] || '').trim();
    if (!cell) break;
    const dayNum = parseInt(cell.split('/')[0], 10);
    if (Number.isNaN(dayNum)) break;
    if (dayNum < prevDay) cursor = cursor.add(1, 'month').date(dayNum);
    else cursor = cursor.date(dayNum);
    map[c] = cursor.format('YYYY-MM-DD');
    prevDay = dayNum;
  }
  return map;
}

/* --- Analytics --- */
function computeProjectHours() {
  // Map<projectId, {projectId, hours, days}>
  const out = new Map();
  for (const log of db.attendance) {
    if (!log.workHours) continue;
    const memberships = db.memberships.filter(m => m.employeeId === log.employeeId);
    const total = memberships.reduce((s,m)=>s+(m.weight||0), 0);
    if (total <= 0) continue;
    for (const m of memberships) {
      const share = (m.weight || 0) / total;
      const hours = Math.round(log.workHours * share * 100) / 100;
      const cur = out.get(m.projectId) || { projectId: m.projectId, hours: 0, days: 0 };
      cur.hours = Math.round((cur.hours + hours) * 100) / 100;
      cur.days += 1;
      out.set(m.projectId, cur);
    }
  }
  return out;
}

function filterList(tableId, q) {
  q = q.trim().toLowerCase();
  $$('#' + tableId + ' tbody tr').forEach(tr => {

    tr.style.display = !q || s.includes(q) ? '' : 'none';

/* ---------------- Import / Export ---------------- */
function exportData() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `mp-data-${dayjs().format('YYYYMMDD-HHmm')}.json`;

async function importDataFile(file) {
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (typeof data !== 'object' || !Array.isArray(data.employees)) throw new Error('文件格式不符');
    confirmDialog(`即将用文件内容覆盖当前本地数据（员工 ${data.employees.length} · 项目 ${data.projects?.length||0} · 考勤 ${data.attendance?.length||0}）。是否继续？`, () => {
      db = { ...defaultStore(), ...data };

    new Chart(barCanvas, {
      type: 'bar',
      data: {
        labels: empHours.map(e => e.name),
        datasets: [{ data: empHours.map(e => e.hours), backgroundColor: '#4292D0', borderRadius: 6 }],
      },
      options: {
        indexAxis: 'y',
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => c.parsed.x.toFixed(1) + 'h' } } },
        scales: { x: { beginAtZero: true, ticks: { color: '#94A3B8', font:{size:11} }, grid: { color: '#EEF2F7' } },
                  y: { ticks: { color: '#334155', font:{size:12} }, grid: { display: false } } },
      },
    });
  }
}

/* ---------------- Boot ---------------- */
render();

// Expose to inline handlers
Object.assign(window, {
  openEmpForm, deleteEmp, openProjForm, deleteProj,
  openAttForm, deleteAtt, importExcel, setAttFilter,
  openMembershipForm, updateMembership, deleteMembership,
  exportData, importDataFile, filterList, wipeAll,
});
</script>
